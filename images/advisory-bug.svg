    <!-- antennae -->
    <path d="M55 26 L44 12"/>
    <path d="M73 26 L84 12"/>
    <!-- legs -->
    <path d="M38 60 L22 52 L14 40"/>
    <path d="M36 80 L14 80"/>
    <path d="M38 100 L22 108 L16 120"/>
    <path d="M90 60 L106 52 L114 40"/>
    <path d="M92 80 L114 80"/>
    <path d="M90 100 L106 108 L112 120"/>

  <circle cx="50" cy="70" r="6" fill="#ffffff"/>
  <circle cx="78" cy="70" r="6" fill="#e3f2fd"/>
  <circle cx="52" cy="96" r="5" fill="#ffffff"/>
  <circle cx="76" cy="96" r="5" fill="#e3f2fd"/>
</svg>
